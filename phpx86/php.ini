; php.ini for Xors3d + FFI (x86 PHP)
; Generated for the Xors3d PHP/FFI binding project.

; --- Extensions ---
; extension_dir points to the bundled ext folder of THIS php build.
extension_dir = "ext"

; FFI is required to talk to Xors3d.dll
extension = ffi

; --- FFI configuration ---
; "true"    - FFI is always enabled (simplest for a desktop app / CLI)
; "preload" - only inside preloaded files
; false     - disabled
; We use CLI scripts, so enable it globally.
ffi.enable = true

; --- OPcache + Zend JIT ---
; OPcache is already loaded in this build; enable it (incl. on CLI) so the
; PHP 8 JIT can run. See https://php.watch/versions/8.0/JIT
opcache.enable = 1
opcache.enable_cli = 1                 ; required, otherwise JIT is dead on CLI

; JIT engine
;   tracing  - traces hot loops/functions (best general-purpose choice)
;   function - per-function compilation
;   disable  - off
opcache.jit = tracing
opcache.jit_buffer_size = 128M         ; 0 = JIT off; must be > 0

; JIT only accelerates PHP bytecode (loops/math), NOT the native FFI calls into
; Xors3d.dll. It mainly helps CPU-heavy PHP per frame (e.g. rwpixel, instancing2
; wave math, particle updates).

; --- Sensible defaults for a native desktop app ---
memory_limit = 512M
error_reporting = E_ALL
display_errors = On
log_errors = On

; Xors3d apps are long-running render loops - no execution time limit on CLI.
max_execution_time = 0

; Timezone (avoids warnings)
date.timezone = UTC
